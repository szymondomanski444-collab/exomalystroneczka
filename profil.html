<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil · Exomaly</title>
<meta name="description" content="Profil użytkownika na stronie Exomaly.">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<style>
  :root{color-scheme:dark;--bg:#000;--card:#101010;--line:#2c2c2c;--fg:#f2f2f2;--mute:#9a9a9a;--acc:#ffffff}
  :root[data-theme="light"]{color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:0 16px 48px}
  .wrap{max-width:560px;margin:0 auto}
  .back{display:inline-block;margin:18px 0 14px;color:var(--mute);text-decoration:none;font-size:.9rem}
  .back:hover{color:var(--fg)}
  .card{background:linear-gradient(180deg,#121212,#0a0a0a);border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative}
  .card.acc{border-color:var(--acc)}
  .banner{height:170px;background:#0a0a0a center/cover no-repeat;border-bottom:1px solid var(--line)}
  .banner.none{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 35%,#000),#050505 70%)}
  .body{padding:0 22px 26px;margin-top:-44px}
  .av{width:88px;height:88px;border-radius:50%;border:3px solid #000;background:#151515 center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:2rem;color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  h1{font-size:1.5rem;margin:12px 0 4px;word-break:break-word}
  .pill{display:inline-block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mute)}
  .pill.adm{color:var(--acc);border-color:var(--acc)}
  .bio{margin:16px 0 0;white-space:pre-wrap;word-break:break-word;color:#dcdcdc}
  .bio.empty{color:var(--mute);font-style:italic}
  .meta{margin-top:18px;color:var(--mute);font-size:.82rem}
  .state{padding:40px 22px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Wróć na stronę</a>
  <div class="card" id="card">
    <div class="state" id="state">Wczytywanie profilu…</div>
  </div>
</div>
<script>
(function(){
  var THEME_ACC={mono:'#ffffff',ember:'#ff7a1a',ice:'#7fd3ff',violet:'#b388ff',moss:'#7fd16a'};
  var THEME_NAME={mono:'Czarny',ember:'Ognisty',ice:'Lodowy',violet:'Fioletowy',moss:'Zielony'};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeImg(src){ return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(src||'') ? src : ''; }
  function fail(text){ document.getElementById('state').textContent=text; }
  var nick=(new URLSearchParams(location.search).get('u')||'').trim();
  if(!nick){ fail('Nie podano, czyj to profil.'); return; }
  document.title='Profil: '+nick+' · Exomaly';
  fetch('/api/profile?u='+encodeURIComponent(nick)).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok,status:r.status,j:j}; });
  }).then(function(res){
    if(!res.ok){ fail(res.status===404?'Nie ma takiego użytkownika.':'Nie udało się wczytać profilu.'); return; }
    var p=res.j, theme=THEME_ACC[p.theme]?p.theme:'mono', adm=p.role==='admin';
    document.documentElement.style.setProperty('--acc',THEME_ACC[theme]);
    var ban=safeImg(p.banner), av=safeImg(p.avatar);
    var letter=esc((p.nick||'?').charAt(0).toUpperCase());
    var since=p.updatedAt?'Ostatnia zmiana profilu: '+esc(p.updatedAt.slice(0,10)):'';
    document.getElementById('card').className='card acc';
    document.getElementById('card').innerHTML=
      '<div class="banner'+(ban?'':' none')+'" style="'+(ban?'background-image:url(\''+ban+'\')':'')+'"></div>'+
      '<div class="body">'+
        '<div class="av" style="'+(av?'background-image:url(\''+av+'\')':'')+'">'+(av?'':letter)+'</div>'+
        '<h1>'+esc(p.nick)+'</h1>'+
        '<span class="pill'+(adm?' adm':'')+'">'+(adm?'administrator':'użytkownik')+'</span>'+
        '<p class="bio'+(p.bio?'':' empty')+'">'+(p.bio?esc(p.bio):'Ten użytkownik nie dodał jeszcze opisu.')+'</p>'+
        '<div class="meta">Motyw: '+esc(THEME_NAME[theme])+(since?' · '+since:'')+'</div>'+
      '</div>';
  }).catch(function(){ fail('Brak połączenia z serwerem.'); });
})();
</script>
</body>
</html>
