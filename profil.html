<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil · Exomaly</title>
<meta name="description" content="Profil użytkownika na stronie Exomaly.">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    color-scheme:dark;
    --bg:#000;--card:#0d0d0d;--line:#222;--fg:#f4f4f4;--mute:#8e8e8e;
    --acc:#ffffff;
    --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
    --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{
    font:400 15px/1.55 var(--f-body);
    min-height:100vh;
    padding:0 16px 56px;
    background:
      radial-gradient(900px 500px at 50% -10%, color-mix(in srgb,var(--acc) 16%,transparent), transparent 70%),
      var(--bg);
  }
  .wrap{max-width:600px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 16px}
  .brand{font:700 .8rem/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--fg);text-decoration:none}
  .back{color:var(--mute);text-decoration:none;font-size:.86rem;font-weight:600}
  .back:hover{color:var(--fg)}

  .card{
    position:relative;
    background:linear-gradient(180deg,#121212 0%,#0a0a0a 100%);
    border:1px solid var(--line);border-radius:26px;overflow:hidden;
    box-shadow:0 30px 80px -40px color-mix(in srgb,var(--acc) 45%,transparent);
  }
  .banner{
    position:relative;height:200px;
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in srgb,var(--acc) 55%,#000) 0%, transparent 60%),
      linear-gradient(135deg,#1b1b1b,#050505);
    background-size:cover;background-position:center;
  }
  .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0d0d0d 100%)}
  .body{position:relative;padding:0 26px 30px}
  .av{
    position:relative;z-index:1;
    width:112px;height:112px;margin-top:-56px;border-radius:50%;
    border:4px solid #0d0d0d;
    background:#161616 center/cover no-repeat;
    display:grid;place-items:center;
    font:700 2.4rem/1 var(--f-display);color:var(--acc);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 70%,transparent), 0 0 32px -6px color-mix(in srgb,var(--acc) 60%,transparent);
  }
  .name{font:700 clamp(1.25rem,4.5vw,1.6rem)/1.2 var(--f-display);margin:16px 0 0;word-break:break-word}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--mute);
  }
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .chip.role{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 60%,transparent)}

  .sect{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
  .label{font:600 .7rem/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
  .bio{margin:0;font-size:1rem;line-height:1.65;color:#dedede;white-space:pre-wrap;word-break:break-word}
  .bio.empty{color:var(--mute);font-style:italic}
  .foot{margin-top:22px;font-size:.78rem;color:var(--mute)}

  .state{padding:56px 26px;text-align:center;color:var(--mute)}
  .state b{display:block;font:700 1rem/1.3 var(--f-display);color:var(--fg);margin-bottom:6px}

  @media (max-width:520px){
    .banner{height:150px}
    .body{padding:0 20px 26px}
    .av{width:96px;height:96px;margin-top:-48px;font-size:2rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">Exomaly</a>
    <a class="back" href="/">← Strona główna</a>
  </header>
  <main class="card" id="card">
    <div class="state" id="state">Wczytywanie profilu…</div>
  </main>
</div>
<script>
(function(){
  var THEME_ACC={mono:'#ffffff',ember:'#ff7a1a',ice:'#7fd3ff',violet:'#b388ff',moss:'#7fd16a'};
  var THEME_NAME={mono:'Czarny',ember:'Ognisty',ice:'Lodowy',violet:'Fioletowy',moss:'Zielony'};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeImg(src){ return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(src||'') ? src : ''; }
  function fmtDate(iso){
    if(!iso) return '';
    var d=new Date(iso); if(isNaN(d)) return '';
    return d.toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
  }
  function fail(title,text){
    document.getElementById('card').innerHTML='<div class="state"><b>'+esc(title)+'</b>'+esc(text)+'</div>';
  }
  var nick=(new URLSearchParams(location.search).get('u')||'').trim();
  if(!nick){ fail('Brak profilu','Nie podano, czyj to profil.'); return; }
  document.title=nick+' · Exomaly';
  fetch('/api/profile?u='+encodeURIComponent(nick)).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok,status:r.status,j:j}; });
  }).then(function(res){
    if(!res.ok){
      fail(res.status===404?'Nie ma takiego użytkownika':'Nie udało się wczytać profilu', res.status===404?'Sprawdź adres albo nick.':'Spróbuj ponownie za chwilę.');
      return;
    }
    var p=res.j, theme=THEME_ACC[p.theme]?p.theme:'mono', adm=p.role==='admin';
    document.documentElement.style.setProperty('--acc',THEME_ACC[theme]);
    var ban=safeImg(p.banner), av=safeImg(p.avatar);
    var letter=esc((p.nick||'?').charAt(0).toUpperCase());
    var upd=fmtDate(p.updatedAt);
    document.getElementById('card').innerHTML=
      '<div class="banner" style="'+(ban?'background-image:url(\''+ban+'\')':'')+'"></div>'+
      '<div class="body">'+
        '<div class="av" style="'+(av?'background-image:url(\''+av+'\')':'')+'">'+(av?'':letter)+'</div>'+
        '<h1 class="name">'+esc(p.nick)+'</h1>'+
        '<div class="chips">'+
          (adm?'<span class="chip role">Administrator</span>':'<span class="chip role">Użytkownik</span>')+
          '<span class="chip"><i></i>'+esc(THEME_NAME[theme])+'</span>'+
        '</div>'+
        '<div class="sect">'+
          '<p class="label">O mnie</p>'+
          '<p class="bio'+(p.bio?'':' empty')+'">'+(p.bio?esc(p.bio):'Ten gracz nie dodał jeszcze opisu.')+'</p>'+
        '</div>'+
        (upd?'<p class="foot">Profil zaktualizowany: '+esc(upd)+'</p>':'')+
      '</div>';
  }).catch(function(){ fail('Brak połączenia','Nie udało się połączyć z serwerem.'); });
})();
</script>
</body>
</html>
