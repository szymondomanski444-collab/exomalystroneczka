<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil · Exomaly</title>
<meta name="description" content="Profil użytkownika na stronie Exomaly.">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    color-scheme:dark;
    --bg:#000;--card:#0d0d0d;--line:#222;--fg:#f4f4f4;--mute:#8e8e8e;
    --acc:#ffffff;
    --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
    --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{
    font:400 15px/1.55 var(--f-body);
    min-height:100vh;
    padding:0 16px 56px;
    background:
      radial-gradient(900px 500px at 50% -10%, color-mix(in srgb,var(--acc) 16%,transparent), transparent 70%),
      var(--bg);
  }
  .wrap{max-width:600px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 16px}
  .brand{font:700 .8rem/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--fg);text-decoration:none}
  .back{color:var(--mute);text-decoration:none;font-size:.86rem;font-weight:600}
  .back:hover{color:var(--fg)}

  .card{
    position:relative;background:#0b0b0b;
    border:1px solid var(--line);border-radius:24px;overflow:hidden;
  }
  /* baner: ukośne linie w kolorze motywu i delikatne przejście w kartę */
  .banner{
    position:relative;height:190px;
    background:radial-gradient(90% 120% at 100% 0%, color-mix(in srgb,var(--acc) 38%,#000), transparent 70%), #070707;
    background-size:cover;background-position:center;
  }
  .banner::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(115deg, color-mix(in srgb,var(--acc) 22%,transparent) 0 1px, transparent 1px 18px);
  }
  .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#0b0b0b 100%)}
  .body{position:relative;padding:0 24px 28px}
  /* awatar: zaokrąglony kwadrat jak karty graczy na stronie */
  .av{
    position:relative;z-index:1;
    width:104px;height:104px;margin-top:-52px;border-radius:22px;
    border:4px solid #0b0b0b;
    background:#141414 center/cover no-repeat;
    display:grid;place-items:center;
    font:700 2.2rem/1 var(--f-display);color:var(--acc);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent);
  }
  /* jedna etykieta: rola nad nickiem */
  .role{margin:20px 0 0;font:600 .7rem/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
  .name{font:700 clamp(1.5rem,6vw,2.1rem)/1.1 var(--f-display);margin:8px 0 0;letter-spacing:-.01em;word-break:break-word}
  .sect{margin-top:22px}
  /* opis jako cytat z akcentem */
  .bio{
    margin:0;padding-left:16px;border-left:2px solid var(--acc);
    font-size:1.02rem;line-height:1.7;color:#e6e6e6;
    white-space:pre-wrap;word-break:break-word;
  }
  .bio.empty{color:var(--mute);font-style:italic;border-left-color:var(--line)}
  .foot{margin-top:24px;font-size:.76rem;color:var(--mute);letter-spacing:.02em}

  .state{padding:56px 26px;text-align:center;color:var(--mute)}
  .state b{display:block;font:700 1rem/1.3 var(--f-display);color:var(--fg);margin-bottom:6px}

  @media (max-width:520px){
    .banner{height:150px}
    .body{padding:0 20px 26px}
    .av{width:88px;height:88px;margin-top:-44px;font-size:1.9rem;border-radius:18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">Exomaly</a>
    <a class="back" href="/">← Strona główna</a>
  </header>
  <main class="card" id="card">
    <div class="state" id="state">Wczytywanie profilu…</div>
  </main>
</div>
<script>
(function(){
  var THEME_ACC={mono:'#ffffff',ember:'#ff7a1a',ice:'#7fd3ff',violet:'#b388ff',moss:'#7fd16a'};
  // Losowe tło przy każdym wejściu: kolory i położenie dwóch poświat
  (function randomBg(){
    var pal=['255,122,26','127,211,255','179,136,255','127,209,106','255,255,255','255,90,130','90,150,255'];
    function pick(){ return pal[Math.floor(Math.random()*pal.length)]; }
    var a=pick(), b=pick();
    var x1=Math.round(5+Math.random()*90), y1=Math.round(-15+Math.random()*50);
    var x2=Math.round(5+Math.random()*90), y2=Math.round(55+Math.random()*50);
    var s1=Math.round(620+Math.random()*420), s2=Math.round(520+Math.random()*380);
    document.body.style.background=
      'radial-gradient('+s1+'px '+Math.round(s1*0.6)+'px at '+x1+'% '+y1+'%, rgba('+a+',.2), transparent 70%),'+
      'radial-gradient('+s2+'px '+Math.round(s2*0.6)+'px at '+x2+'% '+y2+'%, rgba('+b+',.13), transparent 70%),#000';
  })();
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeImg(src){ return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(src||'') ? src : ''; }
  function fmtDate(iso){
    if(!iso) return '';
    var d=new Date(iso); if(isNaN(d)) return '';
    return d.toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
  }
  function fail(title,text){
    document.getElementById('card').innerHTML='<div class="state"><b>'+esc(title)+'</b>'+esc(text)+'</div>';
  }
  var nick=(new URLSearchParams(location.search).get('u')||'').trim();
  if(!nick){ fail('Brak profilu','Nie podano, czyj to profil.'); return; }
  document.title=nick+' · Exomaly';
  fetch('/api/profile?u='+encodeURIComponent(nick)).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok,status:r.status,j:j}; });
  }).then(function(res){
    if(!res.ok){
      fail(res.status===404?'Nie ma takiego użytkownika':'Nie udało się wczytać profilu', res.status===404?'Sprawdź adres albo nick.':'Spróbuj ponownie za chwilę.');
      return;
    }
    var p=res.j, theme=THEME_ACC[p.theme]?p.theme:'mono', adm=p.role==='admin';
    document.documentElement.style.setProperty('--acc',THEME_ACC[theme]);
    var ban=safeImg(p.banner), av=safeImg(p.avatar);
    var letter=esc((p.nick||'?').charAt(0).toUpperCase());
    var upd=fmtDate(p.updatedAt);
    document.getElementById('card').innerHTML=
      '<div class="banner" style="'+(ban?'background-image:url(\''+ban+'\')':'')+'"></div>'+
      '<div class="body">'+
        '<div class="av" style="'+(av?'background-image:url(\''+av+'\')':'')+'">'+(av?'':letter)+'</div>'+
        '<p class="role">'+(adm?'Administrator':'Użytkownik')+'</p>'+
        '<h1 class="name">'+esc(p.nick)+'</h1>'+
        '<div class="sect">'+
          '<p class="bio'+(p.bio?'':' empty')+'">'+(p.bio?esc(p.bio):'Ten gracz nie dodał jeszcze opisu.')+'</p>'+
        '</div>'+
        (upd?'<p class="foot">Zaktualizowano: '+esc(upd)+'</p>':'')+
      '</div>';
  }).catch(function(){ fail('Brak połączenia','Nie udało się połączyć z serwerem.'); });
})();
</script>
</body>
</html>
