<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel bota · Exomaly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--bg2:#0c0c0c;--card:#131313;--line:#2c2c2c;--fg:#fff;--mut:#9b9b9b;--ice:#d6d6d6;--red:#e05a4f;--ok:#7fd18b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:Unbounded,"Arial Black",system-ui,sans-serif;font-weight:500;margin:0}
h1{font-size:1.1rem;letter-spacing:.12em}
.bar{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.filebtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.88rem;display:inline-block}
button:hover:not(:disabled),.filebtn:hover{border-color:var(--fg)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--fg);color:#000;border-color:var(--fg)}
button.danger{color:var(--red)}
button.danger:hover:not(:disabled){border-color:var(--red)}
#st{font-size:.87rem;color:var(--mut);padding:12px 0 0;min-height:1.4em}
#st.err{color:var(--red)}
#st.ok{color:var(--ok)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.pvbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:14px 0 0;position:sticky;top:70px;z-index:4}
.pvbar select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--fg)}
#pv{position:sticky;top:124px;width:100%;height:calc(100vh - 150px);border:1px solid var(--line);border-radius:14px;background:#000}
@media (max-width:1000px){.split{grid-template-columns:1fr}#pv{position:static;height:70vh}}
details.sec{background:var(--bg2);border:1px solid var(--line);border-radius:16px;margin:16px 0;overflow:hidden}
details.sec>summary{cursor:pointer;list-style:none;padding:16px 18px;font-family:Unbounded,"Arial Black",sans-serif;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between}
details.sec>summary::after{content:"▾";color:var(--mut)}
details.sec:not([open])>summary::after{content:"▸"}
details.sec>summary::-webkit-details-marker{display:none}
.sec-b{padding:4px 18px 18px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fld{display:grid;gap:6px;font-size:.8rem;color:var(--mut)}
.fld.wide{grid-column:1/-1}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ice)}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;background:var(--card)}
.item-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.item-h b{font-family:Unbounded,"Arial Black",sans-serif;font-size:.8rem;color:var(--mut)}
.ctl{display:flex;gap:6px}
.ctl button{padding:5px 10px;font-size:.8rem}
.addrow{margin-top:14px}
.hint{color:var(--mut);font-size:.88rem;margin:14px 0 0}
.note{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--mut);font-size:.88rem;margin-top:14px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
#gate .box{width:min(380px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:26px;display:grid;gap:12px}
#gate p{color:var(--mut);margin:0;font-size:.9rem}
#gateMsg{color:var(--red);font-size:.85rem;min-height:1em}
[hidden]{display:none!important}
/* ===== Odświeżony wygląd panelu ===== */
:root{--line2:#3a3a3a;--hover:#181818;--ring:rgba(255,255,255,.12)}
body{background:radial-gradient(70% 40% at 50% -10%,rgba(255,255,255,.05),transparent 70%),#000}
.bar{background:rgba(6,6,6,.9);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.bar h1{display:flex;align-items:center;gap:10px}
.bar h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--fg);box-shadow:0 0 12px rgba(255,255,255,.7)}
.bar .acts button{padding:9px 14px;border-radius:12px}
.bar .acts button.primary{box-shadow:0 0 0 0 rgba(255,255,255,.4)}
.bar .acts button.primary:hover:not(:disabled){box-shadow:0 0 18px rgba(255,255,255,.35)}
button:hover:not(:disabled){background:var(--hover)}
button.primary:hover:not(:disabled){background:#e5e5e5}
.note{background:var(--bg2);border:1px solid var(--line);border-style:solid;border-left:3px solid var(--fg);color:var(--ice);border-radius:12px}
#st{font-weight:600}
.pvbar{border-radius:16px;background:rgba(18,18,18,.9);backdrop-filter:blur(6px)}
#pv{border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);border-color:var(--line2)}
details.sec{border-radius:18px;background:linear-gradient(180deg,#101010,#0a0a0a);transition:border-color .2s}
details.sec[open]{border-color:var(--line2)}
details.sec>summary{padding:18px 20px;transition:background .2s}
details.sec>summary:hover{background:var(--hover)}
.sec-b{padding:6px 20px 22px;border-top:1px solid var(--line)}
.fld{color:var(--ice);font-size:.82rem}
.fld>span{font-weight:600;letter-spacing:.02em}
input,textarea,select{padding:11px 13px;border-color:#2a2a2a;background:#0f0f0f;transition:border-color .2s,box-shadow .2s}
input:hover,textarea:hover,select:hover{border-color:#444}
input:focus,textarea:focus,select:focus{border-color:#fff;box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox]{width:auto;accent-color:#fff}
.item{background:#0f0f0f;border-color:#262626;border-radius:16px;transition:border-color .2s}
.item:hover{border-color:#444}
.item-h b{color:var(--ice);letter-spacing:.06em}
.hint{font-size:.85rem}
#gate{background:radial-gradient(60% 50% at 50% 40%,rgba(255,255,255,.06),transparent 70%),#000}
#gate .box{border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.7);padding:30px}
#gate h1{font-size:1.2rem;text-align:center}
#gate .box>p{text-align:center}
#gate .box button{padding:12px}
@media (max-width:700px){
  .bar .wrap{padding-block:10px}
  .bar .acts{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .bar .acts button,.bar .acts .filebtn{white-space:nowrap;padding:8px 12px;font-size:.82rem}
  .grid{grid-template-columns:1fr}
  .wrap{padding:0 12px}
}
/* Układ: zakładki sekcji + panel podglądu */
.split{display:block}
.stabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 16px;scrollbar-width:thin;position:sticky;top:64px;z-index:3;background:#000}
.stabs button{white-space:nowrap;border-radius:999px;padding:8px 15px;font-size:.84rem;background:#0f0f0f}
.stabs button[aria-selected="true"]{background:#fff;color:#000;border-color:#fff}
details.sec{margin-top:0}
#pvwrap{position:fixed;top:65px;right:0;bottom:0;width:min(560px,52vw);background:#0a0a0a;border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;box-shadow:-24px 0 70px rgba(0,0,0,.7)}
#pvwrap[hidden]{display:none}
#pvwrap .pvhead{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
#pvwrap .pvbar{flex:1;margin:0;position:static;background:none;border:0;padding:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#pvwrap .pvbar select{width:auto}
#pv{flex:1;width:100%;height:auto;min-height:0;border:0;border-radius:0;position:static;box-shadow:none;background:#000}
@media (max-width:700px){#pvwrap{width:100%}.stabs{top:58px}}
.photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.pthumb{width:66px;height:70px;object-fit:cover;object-position:top center;border-radius:10px;border:1px solid var(--line);background:#0a0a0a}
.nophoto{font-size:.8rem;color:var(--mute)}
.brow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sub{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.hint.err{color:#ff8a8a}
</style>
</head>
<body>
  <header class="bar" style="position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(0,0,0,.92);border-bottom:1px solid var(--line,#222)">
    <strong>Panel bota Discorda</strong>
    <a href="/admin.html" style="color:inherit">← Panel admina</a>
  </header>
  <main class="wrap" style="padding:20px 16px 60px;max-width:900px;margin:0 auto">
    <div id="botBox"></div>
  </main>
<script>
(function(){
'use strict';
var OK='exo_admin_pass';
var API='/api/';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pass(){ try{ return sessionStorage.getItem(OK)||''; }catch(e){ return ''; } }
function gate(msg){
  var box=document.getElementById('botBox');
  box.innerHTML='<div class="item"><h3>Zaloguj się</h3><p class="hint">Podaj hasło admina, żeby zarządzać botem.</p>'+
    '<div class="addrow"><input type="password" id="bpass" placeholder="Hasło"><button type="button" class="primary" id="bgo">Wejdź</button></div>'+
    '<div class="hint err" id="bgerr">'+esc(msg||'')+'</div></div>';
  var go=document.getElementById('bgo');
  var doLogin=function(){
    var v=(document.getElementById('bpass').value||'').trim(); if(!v) return;
    try{ sessionStorage.setItem(OK,v); }catch(e){}
    botErr=''; botState=null; botLoading=false; botRender();
  };
  go.addEventListener('click',doLogin);
  document.getElementById('bpass').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
}
// ---- panel bota Discorda ----
var botState=null, botBans=[], botErr='', botLoading=false, botMsgText='', botMsgBad=false;
function botMsg(t,bad){ botMsgText=t; botMsgBad=!!bad; var m=document.getElementById('botMsg'); if(m){ m.className=bad?'hint err':'hint'; m.textContent=t; } }
function botCall(body){
  return fetch(API+'bot-admin',{method:'POST',headers:{'content-type':'application/json','x-admin-pass':pass()},body:JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); });
}
function botLoad(){
  if(botLoading) return; botLoading=true;
  botCall({action:'get'}).then(function(res){
    botLoading=false;
    if(!res.ok && res.status===401){ try{ sessionStorage.removeItem(OK); }catch(e){} gate('Hasło jest nieprawidłowe albo sesja wygasła.'); botLoading=false; return; }
    if(!res.ok){ botErr=res.j.error||'Nie udało się wczytać ustawień bota.'; }
    else { botState=res.j.settings; botBans=res.j.bans||[]; botErr=res.j.bansError?('Lista banów: '+res.j.bansError):''; }
    botRender();
  }).catch(function(){ botLoading=false; botErr='Brak połączenia z serwerem.'; botRender(); });
}
function botInput(k,label,val,ph){
  return '<label class="fld"><span>'+esc(label)+'</span><input data-bf="'+k+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"></label>';
}
function botText(k,label,val){
  return '<label class="fld wide"><span>'+esc(label)+'</span><input data-bt="'+k+'" value="'+esc(val||'')+'"></label>';
}
function botArea(k,label,val){
  return '<label class="fld wide"><span>'+esc(label)+'</span><textarea data-bt="'+k+'" rows="4">'+esc(val||'')+'</textarea></label>';
}
function botColor(k,label,val){
  return '<label class="fld"><span>'+esc(label)+'</span><input data-bc="'+k+'" value="'+esc(val||'')+'" placeholder="#RRGGBB"></label>';
}
function botBansHTML(q){
  var list=botBans.filter(function(b){ var t=(q||'').toLowerCase(); return !t || (b.name||'').toLowerCase().indexOf(t)>=0 || String(b.id).indexOf(t)>=0; });
  if(!botBans.length) return '<p class="hint">Brak zbanowanych użytkowników.</p>';
  if(!list.length) return '<p class="hint">Nic nie pasuje do wyszukiwania.</p>';
  return list.map(function(b){
    return '<div class="brow"><div><b>'+esc(b.name)+'</b><div class="hint">ID: '+esc(b.id)+(b.reason?' · powód: '+esc(b.reason):'')+'</div></div>'+
      '<button type="button" class="primary" data-bot="unban" data-id="'+esc(b.id)+'">Odbanuj</button></div>';
  }).join('');
}
function botRender(){
  var box=document.getElementById('botBox'); if(!box) return;
  if(!botState){
    box.innerHTML = botErr
      ? '<p class="hint err">'+esc(botErr)+'</p><div class="addrow"><button type="button" data-bot="reload">Spróbuj ponownie</button></div>'
      : '<p class="hint">Wczytywanie ustawień bota…</p>';
    if(!botErr && !botLoading) botLoad();
    return;
  }
  var st=botState, tx=st.texts, cl=st.colors;
  box.innerHTML=
    '<p class="hint">Ustawienia zapisują się w panelu i są używane przez bota od razu. Puste ID oznacza, że bot użyje wartości z Vercela (jeśli są).</p>'+
    '<h3 class="sub">Kto i gdzie</h3>'+
    '<div class="grid">'+
      botInput('staffRoleId','ID roli staffu (widzi tickety)',st.staffRoleId,'np. 123456789012345678')+
      botInput('ticketCategoryId','ID kategorii ticketów',st.ticketCategoryId,'kategoria na kanały ticketów')+
      botInput('logChannelId','ID kanału logów moderacji',st.logChannelId,'kanał na logi')+
      botInput('panelChannelId','ID kanału panelu ticketów',st.panelChannelId,'gdzie publikować przycisk ticketów')+
      botInput('matchChannelId','ID kanału powiadomień o meczach',st.matchChannelId,'kanał na nowe mecze')+
      botInput('rulesChannelId','ID kanału regulaminu',st.rulesChannelId,'gdzie opublikować regulamin')+
      botInput('recruitPanelChannelId','ID kanału panelu naboru',st.recruitPanelChannelId,'gdzie publikować panel naboru')+
      botInput('playerRoleId','ID roli gracza (widzi taktyki)',st.playerRoleId,'rola drużyny, np. Gracz')+
      botInput('recruitChannelId','ID kanału zgłoszeń naboru',st.recruitChannelId,'gdzie trafiają zgłoszenia (tylko staff)')+
    '</div>'+
    '<h3 class="sub">Kolory wiadomości</h3>'+
    '<div class="grid">'+
      botColor('info','Informacje',cl.info)+botColor('ok','Sukces',cl.ok)+botColor('warn','Ostrzeżenie',cl.warn)+botColor('bad','Kara / zamknięcie',cl.bad)+
    '</div>'+
    '<h3 class="sub">Teksty wiadomości</h3>'+
    '<div class="grid">'+
      botText('panelTitle','Tytuł panelu',tx.panelTitle)+
      botArea('panelDesc','Opis panelu (Enter = nowa linia)',tx.panelDesc)+
      botText('panelButton','Podpowiedź w menu wyboru kategorii',tx.panelButton)+
      botText('welcomeTitle','Tytuł wiadomości w tickecie',tx.welcomeTitle)+
      botArea('welcomeDesc','Treść wiadomości w tickecie',tx.welcomeDesc)+
      botText('closeButton','Napis na przycisku zamknięcia',tx.closeButton)+
      botText('footer','Stopka wiadomości',tx.footer)+
      botText('recruitTitle','Tytuł panelu naboru',tx.recruitTitle)+
      botText('recruitDesc','Opis panelu naboru',tx.recruitDesc)+
      botText('recruitButton','Podpowiedź w menu stanowisk',tx.recruitButton)+
      '<label class="fld wide"><span>Stanowiska naboru (jedna linia = Nazwa | opis, max 25)</span><textarea data-bf="recruitRoles" rows="4">'+esc(st.recruitRoles||'')+'</textarea></label>'+
      botText('rulesTitle','Tytuł regulaminu',tx.rulesTitle)+
      botText('rulesIntro','Wstęp regulaminu (nad zasadami)',tx.rulesIntro)+
      '<label class="fld wide"><span>Zasady: każdy blok to osobny punkt. Pierwsza linia bloku to tytuł, reszta to treść. Bloki oddziel pustą linią</span><textarea data-bt="rulesBody" rows="8">'+esc(tx.rulesBody||'')+'</textarea></label>'+
    '</div>'+
    '<div class="addrow" style="margin-top:12px"><button type="button" class="primary" data-bot="save">Zapisz ustawienia bota</button> '+
      '<button type="button" data-bot="publish">Opublikuj panel na kanale</button> '+
      '<button type="button" data-bot="register">Zarejestruj komendy</button> '+
      '<button type="button" data-bot="matches">Sprawdź mecze teraz</button> '+
      '<button type="button" data-bot="matchSample">Wyślij przykład na kanał</button> '+
      '<button type="button" data-bot="rules">Opublikuj regulamin</button> '+
      '<button type="button" data-bot="resetRules">Przywróć domyślne teksty panelu i regulaminu</button> '+
      '<button type="button" data-bot="recruit">Opublikuj panel naboru</button></div>'+
    '<div class="hint" id="botMsg">'+esc(botMsgText)+'</div>'+
    '<h3 class="sub">Zbanowani</h3>'+
    (botErr?'<p class="hint err">'+esc(botErr)+'</p>':'')+
    '<input data-bot-search placeholder="Szukaj po nicku albo ID" style="margin-bottom:10px">'+
    '<div id="botBans">'+botBansHTML('')+'</div>';
  if(botMsgText) botMsg(botMsgText,botMsgBad);
}
function botCollect(){
  var box=document.getElementById('botBox'), s={colors:{},texts:{}};
  box.querySelectorAll('[data-bf]').forEach(function(el){ s[el.getAttribute('data-bf')]=el.value.trim(); });
  box.querySelectorAll('[data-bc]').forEach(function(el){ s.colors[el.getAttribute('data-bc')]=el.value.trim(); });
  box.querySelectorAll('[data-bt]').forEach(function(el){ s.texts[el.getAttribute('data-bt')]=el.value.trim(); });
  return s;
}
document.addEventListener('input',function(e){
  if(!(e.target.hasAttribute&&e.target.hasAttribute('data-bot-search'))) return;
  var q=e.target.value, el=document.getElementById('botBans'); if(el) el.innerHTML=botBansHTML(q);
});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-bot]'); if(!b) return;
  var act=b.getAttribute('data-bot');
  if(act==='reload'){ botErr=''; botLoading=false; botRender(); return; }
  if(act==='save'){
    botMsg('Zapisuję…');
    botCall({action:'save',settings:botCollect()}).then(function(res){
      if(!res.ok){ botMsg(res.j.error||'Nie udało się zapisać.',true); return; }
      botState=res.j.settings; botMsg('Ustawienia zapisane. Bot używa ich od razu.');
    }).catch(function(){ botMsg('Brak połączenia z serwerem.',true); });
  }
  else if(act==='publish'){
    botMsg('Publikuję panel…');
    botCall({action:'publish'}).then(function(res){
      botMsg(res.ok?'Panel opublikowany na kanale.':(res.j.error||'Nie udało się opublikować.'),!res.ok);
    }).catch(function(){ botMsg('Brak połączenia z serwerem.',true); });
  }
  else if(act==='recruit'){
    botMsg('Publikuję panel naboru…');
    botCall({action:'publishRecruit'}).then(function(res){
      botMsg(res.ok?'Panel naboru opublikowany na kanale.':(res.j.error||'Nie udało się opublikować panelu naboru.'),!res.ok);
    }).catch(function(){ botMsg('Brak połączenia z serwerem.',true); });
  }
  else if(act==='resetRules'){
    if(!confirm('Przywrócić domyślne teksty panelu i regulaminu? Twoje zmiany w tych polach zostaną nadpisane.')) return;
    botMsg('Przywracam domyślne teksty…');
    botCall({action:'resetTexts',keys:['panelTitle','panelDesc','panelButton','rulesTitle','rulesIntro','rulesBody']}).then(function(res){
      if(!res.ok){ botMsg((res.j&&res.j.error)||'Nie udało się przywrócić tekstów.',true); return; }
      botState=res.j.settings; botRender(); botMsg('Przywrócono domyślne teksty. Opublikuj panel i regulamin ponownie.');
    }).catch(function(){ botMsg('Brak połączenia z serwerem.',true); });
  }
  else if(act==='rules'){
    botMsg('Publikuję regulamin…');
    botCall({action:'publishRules'}).then(function(res){
      botMsg(res.ok?'Regulamin opublikowany na kanale.':(res.j.error||'Nie udało się opublikować regulaminu.'),!res.ok);
    }).catch(function(){ botMsg('Brak połączenia z serwerem.',true); });
  }
  else if(act==='matchSample'){
    botMsg('Wysyłam przykład…');
    botCall({action:'matchSample'}).then(function(res){
      botMsg(res.ok?'Przykład wysłany na kanał powiadomień.':(res.j.error||'Nie udało się wysłać przykładu.'),!res.ok);
    }).catch(function(){ botMsg('Brak połączenia z serwerem.',true); });
  }
  else if(act==='matches'){
    botMsg('Sprawdzam mecze…');
    botCall({action:'matches'}).then(function(res){
      var j=res.j||{};
      if(!res.ok){ botMsg(j.error||'Nie udało się sprawdzić meczów.',true); return; }
      if(j.skipped){ botMsg(j.skipped,true); return; }
      if(j.seeded!==undefined){ botMsg('Zapamiętano obecne mecze ('+j.seeded+'). Od teraz nowe mecze będą wysyłane na kanał.'); return; }
      botMsg(j.sent?('Wysłano powiadomień: '+j.sent+'.'):'Brak nowych meczów.',!j.ok);
    }).catch(function(){ botMsg('Brak połączenia z serwerem.',true); });
  }
  else if(act==='register'){
    botMsg('Rejestruję komendy…');
    fetch(API+'discord-register',{method:'POST',headers:{'x-admin-pass':pass()}})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); })
      .then(function(res){ botMsg(res.ok?('Gotowe: komendy zarejestrowane ('+res.j.commands+').'):((res.j.error||'Błąd rejestracji.')+(res.j.details?' '+res.j.details:'')),!res.ok); })
      .catch(function(){ botMsg('Brak połączenia z serwerem.',true); });
  }
  else if(act==='unban'){
    var id=b.getAttribute('data-id'), who=botBans.filter(function(x){ return x.id===id; })[0];
    if(!confirm('Odbanować '+(who?who.name:id)+'?')) return;
    b.disabled=true;
    botCall({action:'unban',userId:id}).then(function(res){
      if(!res.ok){ b.disabled=false; botMsg(res.j.error||'Nie udało się odbanować.',true); return; }
      botBans=botBans.filter(function(x){ return x.id!==id; });
      var q=(document.querySelector('[data-bot-search]')||{}).value||'';
      var el=document.getElementById('botBans'); if(el) el.innerHTML=botBansHTML(q);
      botMsg('Odbanowano: '+(who?who.name:id)+'.');
    }).catch(function(){ b.disabled=false; botMsg('Brak połączenia z serwerem.',true); });
  }
});
if(!pass()) gate(''); else botRender();
})();
</script>
</body>
</html>
