<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Konta administratorów</title>
<style>
  :root{color-scheme:dark;--bg:#000;--card:#121212;--line:#2c2c2c;--fg:#f2f2f2;--mute:#9a9a9a;--glow:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
  main{max-width:720px;margin:0 auto;display:grid;gap:20px}
  h1{font-size:1.3rem;margin:0}
  .card{background:linear-gradient(180deg,#121212,#0a0a0a);border:1px solid var(--line);border-radius:18px;padding:20px}
  h2{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 14px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0a0a0a;color:var(--fg);font:inherit}
  button{font:inherit;cursor:pointer;border-radius:999px;padding:8px 14px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:.85rem}
  button.primary{background:var(--glow);color:#000;border-color:var(--glow);font-weight:700}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row input{flex:1 1 200px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:520px}
  th{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:12px 6px;border-bottom:1px solid #1c1c1c;vertical-align:middle}
  td.id{font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em}
  .pill{display:inline-block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--mute)}
  .pill.adm{color:var(--fg);border-color:#777}
  .muted{color:var(--mute);font-size:.85rem}
  .err{color:#ff8a8a;min-height:1.2em;font-size:.9rem;margin-top:8px}
  .hidden{display:none!important}
  .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <h1>Konta</h1>

  <section class="card" id="ownerBox">
    <h2>Dostęp właściciela</h2>
    <div class="row">
      <input type="password" id="ownerPw" placeholder="Hasło właściciela" autocomplete="current-password">
      <button class="primary" id="ownerBtn" type="button">Wejdź</button>
    </div>
    <div class="err" id="ownerErr"></div>
  </section>

  <section class="card hidden" id="panel">
    <h2>Konta użytkowników</h2>
    <p class="muted">Każdy, kto założy konto na stronie, dostaje swoje ID. Po tym ID nadajesz uprawnienia administratora.</p>
    <div class="row" style="margin-bottom:12px">
      <input id="find" placeholder="Szukaj po ID lub nicku">
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Nick</th><th>ID</th><th>Rola</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="err" id="listErr"></div>
  </section>
</main>
<script>
(function(){
  var API='/api/auth', KEY='exo_owner';
  var accounts=[];
  function $(id){ return document.getElementById(id); }
  function owner(){ try{ return sessionStorage.getItem(KEY)||''; }catch(e){ return ''; } }
  function call(body){
    return fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-pass':owner()},body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function showPanel(){ $('panel').classList.remove('hidden'); $('ownerBox').classList.add('hidden'); load(); }
  function render(){
    var q=$('find').value.trim().toLowerCase();
    var list=accounts.filter(function(a){ return !q || a.id.toLowerCase().indexOf(q)>=0 || (a.name||'').toLowerCase().indexOf(q)>=0; });
    $('rows').innerHTML=list.length?list.map(function(a){
      var isAdm=a.role==='admin';
      return '<tr><td>'+esc(a.name||'—')+'<div class="muted">'+esc(a.createdAt?a.createdAt.slice(0,10):'')+'</div></td>'+
        '<td class="id">'+esc(a.id)+'</td>'+
        '<td><span class="pill'+(isAdm?' adm':'')+'">'+(isAdm?'admin':'użytkownik')+'</span></td>'+
        '<td><div class="acts">'+
          (isAdm?'<button data-act="revoke" data-id="'+esc(a.id)+'" type="button">Odbierz admina</button>':'<button class="primary" data-act="grant" data-id="'+esc(a.id)+'" type="button">Daj admina</button>')+
          '<button data-act="remove" data-id="'+esc(a.id)+'" type="button">Usuń</button>'+
        '</div></td></tr>';
    }).join(''):'<tr><td colspan="4" class="muted">Brak kont.</td></tr>';
  }
  function load(){
    $('listErr').textContent='';
    call({action:'list'}).then(function(res){
      if(!res.ok){ $('listErr').textContent=res.j.error||'Błąd'; return; }
      accounts=res.j.accounts||[];
      render();
    }).catch(function(){ $('listErr').textContent='Brak połączenia z serwerem.'; });
  }
  $('find').addEventListener('input',render);
  $('ownerBtn').addEventListener('click',function(){
    var p=$('ownerPw').value; if(!p){ $('ownerErr').textContent='Wpisz hasło.'; return; }
    try{ sessionStorage.setItem(KEY,p); }catch(e){}
    call({action:'list'}).then(function(res){
      if(res.ok){ $('ownerErr').textContent=''; accounts=res.j.accounts||[]; showPanel(); render(); }
      else { try{ sessionStorage.removeItem(KEY); }catch(e){} $('ownerErr').textContent=res.status===401?'Złe hasło.':(res.j.error||'Błąd'); }
    }).catch(function(){ $('ownerErr').textContent='Brak połączenia z serwerem.'; });
  });
  $('rows').addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]'); if(!b) return;
    var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
    if(act==='remove' && !confirm('Usunąć konto '+id+'?')) return;
    call({action:act,id:id}).then(function(res){
      if(!res.ok) $('listErr').textContent=res.j.error||'Błąd'; else load();
    });
  });
  if(owner()){ call({action:'list'}).then(function(res){ if(res.ok){ accounts=res.j.accounts||[]; showPanel(); render(); } else { try{ sessionStorage.removeItem(KEY); }catch(e){} } }); }
})();
</script>
</body>
</html>
